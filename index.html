<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fábrica de Óculos — Roleta Promocional</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#063b78}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;font-family:Arial,Helvetica,sans-serif}
.page{width:min(100vw,717px);position:relative}
.stage{
    position:relative;
    width:100%;
    aspect-ratio:717 / 1076;
    background:url("fabrica-layout.png") center top/100% 100% no-repeat;
    overflow:hidden;
}

/* Todas as camadas usam as mesmas proporções da arte original 717x1076. */
.ring{
    position:absolute;
    left:calc(35 / 717 * 100%);
    top:calc(188 / 1076 * 100%);
    width:calc(644 / 717 * 100%);
    height:auto;
    z-index:2;
    pointer-events:none;
}

.wheel-wrap{
    position:absolute;
    left:calc(87 / 717 * 100%);
    top:calc(241 / 1076 * 100%);
    width:calc(538 / 717 * 100%);
    aspect-ratio:1;
    z-index:3;
    border-radius:50%;
    overflow:visible;
}

.wheel{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    transform:rotate(0deg);
    transform-origin:50% 50%;
    transition:transform 4.2s cubic-bezier(.12,.72,.12,1);
    will-change:transform;
    pointer-events:none;
}

.pointer{
    position:absolute;
    left:calc(303 / 717 * 100%);
    top:calc(145 / 1076 * 100%);
    width:calc(108 / 717 * 100%);
    height:auto;
    z-index:7;
    pointer-events:none;
}

.center{
    position:absolute;
    left:calc(276 / 717 * 100%);
    top:calc(430 / 1076 * 100%);
    width:calc(160 / 717 * 100%);
    height:auto;
    z-index:8;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));
}

.hit-button{
    position:absolute;
    left:calc(155 / 717 * 100%);
    top:calc(847 / 1076 * 100%);
    width:calc(410 / 717 * 100%);
    height:calc(118 / 1076 * 100%);
    z-index:9;
    border:0;
    background:transparent;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

.resultado{
    width:calc(100% - 60px);
    max-width:650px;
    margin:12px auto 30px;
    min-height:48px;
    border:2px solid #ffd100;
    border-radius:12px;
    background:#063b78;
    color:#ffd100;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px 16px;
    font-weight:900;
    font-size:clamp(16px,3.5vw,24px);
}

@media(max-width:500px){
    .resultado{width:calc(100% - 28px);margin-top:10px;font-size:17px}
}

@media(min-width:718px){
    .stage{box-shadow:0 0 25px rgba(0,0,0,.25)}
}
</style>
</head>

<body>
<div class="page">
    <div class="stage" id="stage">

        <!-- Fundo original, sem alterar o layout -->
        <!-- A roleta animada é composta por uma camada interna + aro fixo. -->

        <img class="ring" src="ring-fixed.png" alt="" aria-hidden="true">

        <div class="wheel-wrap">
            <img id="wheel" class="wheel" src="wheel-inner-rotating.png" alt="Roleta">
        </div>

        <img class="pointer" src="pointer-crop.png" alt="" aria-hidden="true">

        <!-- Centro permanece fixo enquanto a roleta gira -->
        <img id="centerButton" class="center" src="center-button.png" alt="Girar">

        <!-- Botão que fica exatamente sobre o botão amarelo da arte -->
        <button id="hitButton" class="hit-button" aria-label="Girar a roleta"></button>
    </div>

    <div id="resultado" class="resultado">Clique em GIRAR A ROLETA para participar!</div>
</div>

<script>
const premios = [
    "10% DE DESCONTO",
    "ARMAÇÃO CORTESIA COMUM",
    "15% DE DESCONTO",
    "ÓCULOS DE SOL",
    "LIMPA LENTE CLEAN'UP",
    "LIMPA LENTE GRÁTIS"
];

const wheel = document.getElementById("wheel");
const centerButton = document.getElementById("centerButton");
const hitButton = document.getElementById("hitButton");
const resultado = document.getElementById("resultado");

let girando = false;
let rotacaoAtual = 0;

function girar() {
    if (girando) return;

    girando = true;
    resultado.textContent = "Girando...";

    const indice = Math.floor(Math.random() * premios.length);

    // A arte original começa com 10% no topo e segue no sentido horário:
    // 10%, armação, 15%, óculos de sol, Clean'Up, limpa lente grátis.
    // Para colocar a fatia sorteada exatamente sob o ponteiro:
    const ajuste = (360 - (indice * 60)) % 360;
    const voltas = 5 + Math.floor(Math.random() * 2);

    rotacaoAtual += voltas * 360 + ajuste;
    wheel.style.transform = `rotate(${rotacaoAtual}deg)`;

    setTimeout(() => {
        resultado.textContent = `🎉 VOCÊ GANHOU: ${premios[indice]}!`;
        girando = false;
    }, 4300);
}

hitButton.addEventListener("click", girar);
centerButton.addEventListener("click", girar);
</script>
</body>
</html>
