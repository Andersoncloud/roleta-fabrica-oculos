<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fábrica de Óculos — Roleta Promocional</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#063b78}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
.page{width:min(100vw,717px);position:relative}
.stage{
    position:relative;
    width:100%;
    aspect-ratio:717 / 1076;
    background:url("fabrica-layout.png") center top/100% 100% no-repeat;
    overflow:hidden;
    touch-action:manipulation;
}

/*
   A composição inteira usa a mesma referência 717x1076.
   Portanto, no celular tudo é reduzido proporcionalmente sem
   alterar a posição relativa dos elementos.
*/
.wheel-wrap{
    position:absolute;
    left:calc(87 / 717 * 100%);
    top:calc(241 / 1076 * 100%);
    width:calc(538 / 717 * 100%);
    aspect-ratio:1;
    z-index:3;
    border-radius:50%;
    overflow:visible;
}

/* SOMENTE os setores giram. Não contém fundo, aro ou botão. */
.wheel{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    transform:rotate(0deg);
    transform-origin:50% 50%;
    transition:transform 4.2s cubic-bezier(.12,.72,.12,1);
    will-change:transform;
    pointer-events:none;
}

/* Aro fixo */
.ring{
    position:absolute;
    left:calc(87 / 717 * 100%);
    top:calc(241 / 1076 * 100%);
    width:calc(538 / 717 * 100%);
    height:auto;
    z-index:5;
    pointer-events:none;
}

/* Ponteiro fixo */
.pointer{
    position:absolute;
    left:calc(303 / 717 * 100%);
    top:calc(145 / 1076 * 100%);
    width:calc(110 / 717 * 100%);
    height:auto;
    z-index:7;
    pointer-events:none;
}

/* Centro fixo */
.center{
    position:absolute;
    left:calc(276 / 717 * 100%);
    top:calc(430 / 1076 * 100%);
    width:calc(160 / 717 * 100%);
    height:auto;
    z-index:8;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));
    touch-action:manipulation;
}

/* Área clicável sobre o botão amarelo que já existe na arte */
.hit-button{
    position:absolute;
    left:calc(155 / 717 * 100%);
    top:calc(847 / 1076 * 100%);
    width:calc(410 / 717 * 100%);
    height:calc(118 / 1076 * 100%);
    z-index:9;
    border:0;
    padding:0;
    margin:0;
    background:transparent;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
}

.resultado{
    width:calc(100% - 60px);
    max-width:650px;
    margin:12px auto 30px;
    min-height:48px;
    border:2px solid #ffd100;
    border-radius:12px;
    background:#063b78;
    color:#ffd100;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px 16px;
    font-weight:900;
    font-size:clamp(16px,3.5vw,24px);
}

@media(max-width:500px){
    .resultado{width:calc(100% - 28px);margin-top:10px;margin-bottom:20px;font-size:17px}
}

@media(min-width:718px){
    .stage{box-shadow:0 0 25px rgba(0,0,0,.25)}
}
</style>
</head>
<body>
<div class="page">
    <div class="stage" id="stage">
        <!-- Aro parado -->
        <img class="ring" src="ring-only.png" alt="" aria-hidden="true">

        <!-- ÚNICA camada que gira -->
        <div class="wheel-wrap">
            <img id="wheel" class="wheel" src="wheel-sectors.png" alt="Roleta">
        </div>

        <!-- Elementos que nunca giram -->
        <img class="pointer" src="pointer-transparent.png" alt="" aria-hidden="true">
        <img id="centerButton" class="center" src="center-only.png" alt="Girar">

        <!-- Botão sobre a arte original -->
        <button id="hitButton" class="hit-button" aria-label="Girar a roleta"></button>
    </div>

    <div id="resultado" class="resultado">Clique em GIRAR A ROLETA para participar!</div>
</div>

<script>
const premios = [
    "10% DE DESCONTO",
    "ARMAÇÃO CORTESIA COMUM",
    "15% DE DESCONTO",
    "ÓCULOS DE SOL",
    "LIMPA LENTE CLEAN'UP",
    "LIMPA LENTE GRÁTIS"
];

const wheel = document.getElementById("wheel");
const centerButton = document.getElementById("centerButton");
const hitButton = document.getElementById("hitButton");
const resultado = document.getElementById("resultado");

let girando = false;
let rotacaoAtual = 0;
const DURACAO = 4200;
const SETOR = 60;

function normalizarAngulo(angulo){
    return ((angulo % 360) + 360) % 360;
}

function girar(){
    if(girando) return;

    girando = true;
    resultado.textContent = "Girando...";

    // A imagem original, sem rotação, possui os setores nesta ordem,
    // começando pelo topo e seguindo no sentido horário:
    // 0  = 10%
    // 1  = Armação
    // 2  = 15%
    // 3  = Óculos de Sol
    // 4  = Clean'Up
    // 5  = Limpa Lente Grátis
    const indice = Math.floor(Math.random() * premios.length);

    const atual = normalizarAngulo(rotacaoAtual);
    const desejado = normalizarAngulo(-indice * SETOR);

    // Faz sempre várias voltas para frente e termina exatamente
    // com o centro do setor sorteado apontando para o ponteiro.
    let delta = desejado - atual;
    if(delta < 0) delta += 360;

    const voltas = 5 + Math.floor(Math.random() * 2); // 5 ou 6
    const novaRotacao = rotacaoAtual + voltas * 360 + delta;

    rotacaoAtual = novaRotacao;
    wheel.style.transform = `rotate(${novaRotacao}deg)`;

    window.setTimeout(() => {
        resultado.textContent = `🎉 VOCÊ GANHOU: ${premios[indice]}!`;
        girando = false;
    }, DURACAO + 100);
}

hitButton.addEventListener("click", girar);
centerButton.addEventListener("click", girar);
</script>
</body>
</html>
